<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clauding</title>
<link rel="stylesheet" href="sahne.css">
</head>
<body>
  <div class="zemin" aria-hidden="true"><div class="isik"></div><div class="nokta"></div><div class="gren"></div></div>

  <header class="ust">

      <span class="marka"><i class="marka-nokta"></i>Clauding</span>
      <span class="ozet" id="ozet"></span>
    </div>
    <nav class="ust-sag" id="ustSag">
      <span class="etiket" data-i18n="alan"></span>
      <button class="alan" data-alan="tam" data-i18n="tam"></button>
      <button class="alan" data-alan="sol" data-i18n="sol"></button>
      <button class="alan" data-alan="sag" data-i18n="sag"></button>
      <span class="ayirac"></span>
      <span class="dizilimler" id="dizilimler">
        <button class="dizilim" data-dizilim="auto" data-i18n-title="dAuto"><svg viewBox="0 0 20 14"><rect x="1" y="1" width="8.5" height="5.5" rx="1.2"/><rect x="10.5" y="1" width="8.5" height="5.5" rx="1.2"/><rect x="1" y="7.5" width="5.4" height="5.5" rx="1.2"/><rect x="7.3" y="7.5" width="5.4" height="5.5" rx="1.2"/><rect x="13.6" y="7.5" width="5.4" height="5.5" rx="1.2"/></svg></button>
        <button class="dizilim" data-dizilim="cols" data-i18n-title="dCols"><svg viewBox="0 0 20 14"><rect x="1" y="1" width="3.8" height="12" rx="1.2"/><rect x="5.7" y="1" width="3.8" height="12" rx="1.2"/><rect x="10.5" y="1" width="3.8" height="12" rx="1.2"/><rect x="15.2" y="1" width="3.8" height="12" rx="1.2"/></svg></button>

      </span>
      <span class="ayirac"></span>
      <button class="gerial" id="gerial" hidden></button>
      <button class="ust-dugme" id="ekranDugme" data-i18n-title="oburEkranAc"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.5"/><path d="M6 14h4M8 11v3"/></svg><span data-i18n="oburEkran"></span></button>
      <button class="ust-dugme" id="tuslarDugme" data-i18n-title="kisayollarAc"><svg viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8.5" rx="1.8"/><path d="M4.5 7h.01M7 7h.01M9.5 7h.01M12 7h.01M5 9.8h6"/></svg><span data-i18n="kisayollar"></span></button>

      <span class="yeni-grup">
        <button class="yeni" id="yeni"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span data-i18n="yeniClaude"></span></button>
        <button class="yeni-ok" id="yeniOk" data-i18n-title="klasorAc"><svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>

  <main id="karolar"></main>
  <div id="aralar"></div>
  <div class="kenar sol" data-e="sol"><i></i></div>
  <div class="kenar sag" data-e="sag"><i></i></div>
  <div class="kenar ust" data-e="ust"><i></i></div>
  <div class="kenar alt" data-e="alt"><i></i></div>
  <div class="ipucu" id="ipucu"></div>

  <script src="dil.js"></script>
  <script src="sahne.js"></script>

</html>
